version: '3.8'

services:
  neo4j-test:
    image: neo4j:5.18-community
    container_name: doan16_neo4j_test
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=neo4j/test_password_123
      - NEO4J_PLUGINS=[]
    volumes:
      - neo4j_test_data:/data
      - neo4j_test_logs:/logs

  redis-test:
    image: redis:7.2-alpine
    container_name: doan16_redis_test
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_test_data:/data

volumes:
  neo4j_test_data:
  neo4j_test_logs:
  redis_test_data:

