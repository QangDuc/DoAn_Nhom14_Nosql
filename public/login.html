<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Hệ Thống — FinGuard Pro</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-body);
      padding: 20px;
    }
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
    }
    .login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .login-brand svg {
      width: 36px;
      height: 36px;
      fill: var(--primary);
    }
    .login-brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      margin: 0;
      color: var(--text-normal);
      letter-spacing: -0.5px;
    }
    .role-selector {
      display: flex;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .role-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      user-select: none;
    }
    .role-btn.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: var(--shadow-xs);
    }
    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    .demo-hint {
      margin-top: 20px;
      padding: 12px;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      color: var(--text-muted);
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <svg viewBox="0 0 24 24">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
      </svg>
      <h1>FinGuard Security</h1>
    </div>

    <!-- CHỌN VAI TRÒ: KHÁCH HÀNG HOẶC NHÂN VIÊN/QUẢN TRỊ -->
    <div class="role-selector">
      <div id="btn-role-customer" class="role-btn active" onclick="switchLoginRole('CUSTOMER')">
        Khách Hàng
      </div>
      <div id="btn-role-staff" class="role-btn" onclick="switchLoginRole('STAFF')">
        Nhân Viên / Quản Trị
      </div>
    </div>

    <div id="login-alert" class="alert-box"></div>

    <form id="login-form" onsubmit="handleFormLogin(event)">
      <div class="form-field">
        <label id="label-username" for="input-username">Mã tài khoản khách hàng:</label>
        <input type="text" id="input-username" value="ACC002" placeholder="VD: ACC002" required autocomplete="username" />
      </div>

      <div class="form-field">
        <label for="input-password">Mật khẩu:</label>
        <input type="password" id="input-password" value="" placeholder="Nhập mật khẩu" required autocomplete="current-password" />
      </div>

      <button type="submit" id="btn-submit" class="btn-primary" style="width:100%; height:42px; margin-top:8px;">
        Đăng Nhập
      </button>
    </form>

    <div class="demo-hint" id="demo-hint-box">
      <b>Tài khoản mẫu:</b>
      <div id="hint-text" style="margin-top:4px;">
        • Khách hàng: <code>ACC002</code> đến <code>ACC050</code><br>
        • Chuyển đến giao diện cá nhân (<code>/app/</code>)
      </div>
    </div>
  </div>

  <script>
    let currentRole = 'CUSTOMER';

    function switchLoginRole(role) {
      currentRole = role;
      const btnCustomer = document.getElementById('btn-role-customer');
      const btnStaff = document.getElementById('btn-role-staff');
      const labelUsername = document.getElementById('label-username');
      const inputUsername = document.getElementById('input-username');
      const inputPassword = document.getElementById('input-password');
      const hintText = document.getElementById('hint-text');
      const alertBox = document.getElementById('login-alert');
      alertBox.style.display = 'none';

      inputPassword.value = '';

      if (role === 'CUSTOMER') {
        btnCustomer.classList.add('active');
        btnStaff.classList.remove('active');
        labelUsername.textContent = 'Mã tài khoản khách hàng:';
        inputUsername.placeholder = 'VD: ACC002';
        inputUsername.value = 'ACC002';
        hintText.innerHTML = '• Khách hàng: <code>ACC002</code> đến <code>ACC050</code><br>• Chuyển đến giao diện cá nhân (<code>/app/</code>)';
      } else {
        btnStaff.classList.add('active');
        btnCustomer.classList.remove('active');
        labelUsername.textContent = 'Mã nhân viên / Mã quản trị:';
        inputUsername.placeholder = 'VD: STAFF001 hoặc ACC001';
        inputUsername.value = 'STAFF001';
        hintText.innerHTML = '• Nhân viên / Analyst: <code>STAFF001</code>, <code>STAFF002</code>, <code>STAFF003</code> (Mật khẩu: <code>NhanVien@123</code>)<br>• Quản trị viên Customer: <code>ACC001</code> (Mật khẩu: <code>Admin@123</code>)<br>• Chuyển đến Dashboard giám sát (<code>/index.html</code>)';
      }
    }

    async function handleFormLogin(event) {
      event.preventDefault();
      const username = document.getElementById('input-username').value.trim();
      const password = document.getElementById('input-password').value;
      const btnSubmit = document.getElementById('btn-submit');
      const alertBox = document.getElementById('login-alert');

      alertBox.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Đang xử lý...';

      try {
        const isStaff = username.toUpperCase().startsWith('STAFF') || currentRole === 'STAFF';
        const endpoint = isStaff ? '/api/staff/login' : '/api/auth/login';
        const body = isStaff ? { staffId: username, password } : { accountId: username, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'include'
        });

        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'alert-box alert-success';
          alertBox.textContent = data.message || 'Đăng nhập thành công! Đang chuyển hướng...';
          alertBox.style.display = 'block';

          // Lưu token trong sessionStorage
          sessionStorage.setItem('fg_auth_token', data.token);
          sessionStorage.setItem('token', data.token);

          const role = data.role || (data.staff && data.staff.role) || (data.account && data.account.role);
          sessionStorage.setItem('fg_user_role', role);

          if (data.staff) {
            sessionStorage.setItem('fg_auth_account', data.staff.staffId);
            sessionStorage.setItem('fg_staff_role', data.staff.role);
          } else if (data.account) {
            sessionStorage.setItem('fg_auth_account', data.account.accountId);
          }

          if (role === 'ADMIN' || role === 'ANALYST') {
            setTimeout(() => {
              window.location.href = '/index.html';
            }, 600);
          } else {
            setTimeout(() => {
              window.location.href = '/app/';
            }, 600);
          }
        } else {
          alertBox.className = 'alert-box alert-danger';
          alertBox.textContent = data.error || 'Đăng nhập thất bại';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.className = 'alert-box alert-danger';
        alertBox.textContent = 'Lỗi kết nối máy chủ: ' + err.message;
        alertBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Đăng Nhập';
      }
    }
  </script>
</body>
</html>
